# Spike #33: viewer renderer and footprint (glow vs wgpu/DX12).
# Its own workspace: spike code, not product code.
[workspace]

[package]
name = "viewer-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["wgpu"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = [
  "default_fonts",
  "wayland",
  "x11",
] }
egui_table = "=0.11.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
] }

[profile.release]
debug = 1
lto = "thin"
