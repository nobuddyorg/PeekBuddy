# Spike #34: probes what GitHub-hosted Windows runners can do.
# Its own workspace: spike code, not product code, so the workspace lint
# policy and check-unsafe do not apply.
[workspace]

[package]
name = "runner-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
