# Spike #31: can a standard user tail the USN journal? Its own workspace:
# spike code, not product code. `unsafe` blocks still carry SAFETY comments so
# the probe can be promoted into peekbuddy-win on GO.
[workspace]

[package]
name = "usn-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }
