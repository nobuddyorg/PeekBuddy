name: Bug report
description: Something PeekBuddy does wrong or misses.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: PeekBuddy version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: From `winver`, for example "Windows 11 24H2, build 26100.2314".
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options: [x64, arm64]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is PeekBuddy installed?
      options: [Portable zip, winget, Built from source]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `peekbuddy --diagnostics`.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Watch C:\work recursively
        2. Save a file in VS Code
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
