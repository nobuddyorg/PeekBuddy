# Steps dist runs on every build runner before it builds (#73).
- name: Unsigned build (O3, ADR 0012)
  shell: bash
  run: echo "unsigned build - O3, ADR 0012 - the signing step of issue 74 goes between the build and the archive"
- name: Install cargo-about
  uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
  with:
    tool: cargo-about@0.9.2
- name: Third-party licences
  shell: bash
  run: cargo about generate --locked --workspace --output-file THIRD_PARTY_LICENSES.html dist/about.hbs
