# Nightly quality jobs (#17). Each failing job opens or updates one
# tracking issue (label `nightly`); the next green run closes it.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: Miri (OS-independent crates)
        run: cargo +nightly miri test --locked -p peekbuddy-core -p peekbuddy-win --target x86_64-unknown-linux-gnu

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List targets
        id: targets
        run: |
          targets="$(find fuzz/fuzz_targets -name '*.rs' -exec basename {} .rs \; 2>/dev/null | sort | tr '\n' ' ')"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          echo "fuzz targets: ${targets:-none yet}"
      - name: Nightly toolchain
        if: steps.targets.outputs.targets != ''
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.targets.outputs.targets != ''
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.targets.outputs.targets != ''
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for 20 minutes
        if: steps.targets.outputs.targets != ''
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          for target in ${TARGETS}; do
            cargo +nightly fuzz run "${target}" -- -max_total_time=1200
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  proptest-long:
    name: long property tests
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROPTEST_CASES: 10000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass

  stress:
    name: fs-serial stress
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass -E 'test-group(fs-serial)' --stress-duration 30m

  beta:
    name: beta canary
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Beta toolchain
        run: rustup toolchain install beta --profile minimal --component clippy
      - run: cargo +beta clippy --workspace --all-targets --all-features --locked
      - run: cargo +beta test --workspace --locked

  fresh-deps:
    name: fresh dependencies
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - run: cargo update
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  mutants:
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149,cargo-mutants@27.1.0
      - name: Mutants shard
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          $env:TMP = 'C:\t'
          $env:TEMP = 'C:\t'
          cargo mutants --no-shuffle --shard "$env:SHARD/8" --test-tool nextest --in-place --timeout-multiplier 2
      - name: Summary
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          count() { [ -f "mutants.out/$1.txt" ] && wc -l < "mutants.out/$1.txt" || echo 0; }
          skips="$(grep -rE 'mutants::skip' --include='*.rs' crates | wc -l)"
          {
            echo "### mutants shard ${SHARD}/8"
            echo "| caught | missed | unviable | timeout | skip attributes |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $(count caught) | $(count missed) | $(count unviable) | $(count timeout) | ${skips} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutants-core-linux:
    name: mutants (core, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149,cargo-mutants@27.1.0
      - run: cargo mutants --no-shuffle -p peekbuddy-core --test-tool nextest

  report:
    name: report
    if: always() && github.event_name == 'schedule'
    needs: [miri, fuzz, proptest-long, stress, beta, fresh-deps, mutants, mutants-core-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open, update and close the nightly tracking issues
    steps:
      - name: Open, update or close one issue per job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --repo "${REPO}" --color 5319E7 --description "Nightly job failures" 2>/dev/null || true
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | while read -r job result; do
            title="nightly: ${job} failing"
            number="$(gh issue list --repo "${REPO}" --label nightly --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')"
            if [ "${result}" = "failure" ]; then
              if [ -n "${number}" ]; then
                gh issue comment "${number}" --repo "${REPO}" --body "Still failing: ${RUN_URL}"
              else
                gh issue create --repo "${REPO}" --title "${title}" --label nightly --body "The nightly job \`${job}\` failed: ${RUN_URL}"
              fi
            elif [ "${result}" = "success" ] && [ -n "${number}" ]; then
              gh issue close "${number}" --repo "${REPO}" --comment "Green again: ${RUN_URL}"
            fi
          done
