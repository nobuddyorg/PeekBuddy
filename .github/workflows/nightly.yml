# Nightly quality jobs (#17). Each failing job opens or updates one
# tracking issue (label `nightly`); the next green run closes it.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain with Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: Miri (OS-independent crates)
        # Miri looks for UB, not for rare inputs: proptest-long covers depth.
        env:
          PROPTEST_CASES: 16
          # Failure files need the file system, which Miri isolates.
          PROPTEST_DISABLE_FAILURE_PERSISTENCE: 1
          # Miri passes no host environment variables unless forwarded. Isolation
          # is off because the insta snapshot tests read their files; nothing
          # here writes outside the target directory.
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-env-forward=PROPTEST_CASES -Zmiri-env-forward=PROPTEST_DISABLE_FAILURE_PERSISTENCE
        run: cargo +nightly miri test --locked -p peekbuddy-core -p peekbuddy-win -p peekbuddy-alloc -p peekbuddy-churn --lib --target x86_64-unknown-linux-gnu

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List targets
        id: targets
        run: |
          targets="$(find fuzz/fuzz_targets -name '*.rs' -exec basename {} .rs \; 2>/dev/null | sort | tr '\n' ' ')"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          echo "fuzz targets: ${targets:-none yet}"
      - name: Nightly toolchain
        if: steps.targets.outputs.targets != ''
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: steps.targets.outputs.targets != ''
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.targets.outputs.targets != ''
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target for 20 minutes
        if: steps.targets.outputs.targets != ''
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          for target in ${TARGETS}; do
            cargo +nightly fuzz run "${target}" -- -max_total_time=1200
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  proptest-long:
    name: long property tests
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PROPTEST_CASES: 10000
      PEEKBUDDY_HEAVY_CASES: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass
      # The one test that is too long for a PR: 10 million events through the
      # deriver (#41). The other ignored tests are child entry points and a
      # fixture writer, and stay ignored.
      - name: Ten million events through the deriver
        run: cargo nextest run -p peekbuddy-core --profile ci --locked --run-ignored ignored-only -E 'test(ten_million_distinct_paths)'

  stress:
    name: fs-serial stress
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass -E 'binary(/^fs_serial/)' --stress-duration 30m

  vhd:
    name: vhd detach and attach (#48)
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      # The hosted runner is elevated and has diskpart; the test skips itself
      # without this variable.
      - run: cargo nextest run --locked --profile ci -p peekbuddy-engine -E 'binary(fs_serial_vhd)'
        env:
          PEEKBUDDY_VHD_TESTS: "1"

  beta:
    name: beta canary
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Beta toolchain
        run: rustup toolchain install beta --profile minimal --component clippy
      - run: cargo +beta clippy --workspace --all-targets --all-features --locked
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo +beta nextest run --workspace --profile ci --locked --no-tests=pass

  fresh-deps:
    name: fresh dependencies
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo update
      - run: cargo build --workspace --all-targets
      # nextest, not cargo test: the fs-serial group only exists under nextest.
      - run: cargo nextest run --workspace --profile ci --no-tests=pass

  mutants:
    name: mutants (shard ${{ matrix.shard }}/8)
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-mutants@27.1.0
      - name: Mutants shard
        shell: pwsh
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          $env:TMP = 'C:\t'
          $env:TEMP = 'C:\t'
          cargo mutants --no-shuffle --shard "$env:SHARD/8" --test-tool nextest --in-place --timeout-multiplier 2
      - name: Summary
        if: always()
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          count() { [ -f "mutants.out/$1.txt" ] && wc -l < "mutants.out/$1.txt" || echo 0; }
          skips="$( (grep -rE 'mutants::skip' --include='*.rs' crates || true) | wc -l)"
          {
            echo "### mutants shard ${SHARD}/8"
            echo "| caught | missed | unviable | timeout | skip attributes |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $(count caught) | $(count missed) | $(count unviable) | $(count timeout) | ${skips} |"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutants-core-linux:
    name: mutants (core, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.149,cargo-mutants@27.1.0
      - run: cargo mutants --no-shuffle -p peekbuddy-core --test-tool nextest

  bench-trend:
    # Full criterion suite on main (#26): medians to gh-pages through
    # github-action-benchmark, and the +25 % rolling-median alert from
    # `cargo xtask bench-trend` (the action only compares with the previous
    # point). An alert fails this job, so `report` opens or updates the
    # `nightly: bench-trend failing` issue with the run's table.
    name: bench trend (windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # github-action-benchmark pushes the data to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - name: Earlier points from gh-pages
        id: history
        shell: bash
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir -p target/bench-trend
          if git fetch --depth 1 "${REPO_URL}" gh-pages; then
            git show FETCH_HEAD:dev/bench/data.js > target/bench-trend/history.js || true
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            # First run: an empty local gh-pages branch for the action to
            # commit into; its push creates the remote branch.
            echo "no gh-pages branch yet: no baseline"
            # Not `git switch -` below: the checkout is detached and has no
            # previous branch to go back to.
            start="$(git rev-parse HEAD)"
            git switch --orphan gh-pages
            git -c user.name=github-actions -c user.email=github-actions@github.com \
              commit --allow-empty -m "chore: start gh-pages for the bench trend"
            git switch --detach "${start}"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Bench trend
        id: trend
        run: cargo xtask bench-trend --rounds 10 --history target/bench-trend/history.js
      - name: Publish to gh-pages
        if: always() && hashFiles('target/bench-trend/output.json') != ''
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: benches (windows-2025)
          tool: customSmallerIsBetter
          output-file-path: target/bench-trend/output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'schedule' }}
          skip-fetch-gh-pages: ${{ steps.history.outputs.exists != 'true' }}
          # The rolling-median alert is xtask's; the action's own alert
          # (previous point only) stays off.
          comment-on-alert: false
          fail-on-alert: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-trend
          path: |
            target/bench-trend/output.json
            target/bench-trend/report.md
          if-no-files-found: ignore

  report:
    name: report
    if: always() && github.event_name == 'schedule'
    needs: [miri, fuzz, proptest-long, stress, vhd, beta, fresh-deps, mutants, mutants-core-linux, bench-trend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # open, update and close the nightly tracking issues
    steps:
      - name: Open, update or close one issue per job
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly --repo "${REPO}" --color 5319E7 --description "Nightly job failures" 2>/dev/null || true
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | while read -r job result; do
            title="nightly: ${job} failing"
            number="$(gh issue list --repo "${REPO}" --label nightly --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')"
            if [ "${result}" = "failure" ]; then
              if [ -n "${number}" ]; then
                gh issue comment "${number}" --repo "${REPO}" --body "Still failing: ${RUN_URL}"
              else
                gh issue create --repo "${REPO}" --title "${title}" --label nightly --body "The nightly job \`${job}\` failed: ${RUN_URL}"
              fi
            elif [ "${result}" = "success" ] && [ -n "${number}" ]; then
              gh issue close "${number}" --repo "${REPO}" --comment "Green again: ${RUN_URL}"
            fi
          done
