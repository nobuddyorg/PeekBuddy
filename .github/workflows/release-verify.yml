# Checks the assets a release published, on each native runner (#73): the
# checksum, the attestation, a smoke run of the exe and `cargo audit bin`.
# Called by release.yml after the release is published.
name: release-verify

on:
  workflow_call:
    inputs:
      tag:
        description: the tag of the release to verify
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: verify (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read # download the release assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-vs2026-arm
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download the published assets
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*$env:TARGET*" --pattern SHA256SUMS --dir assets
          Get-ChildItem assets | Format-Table Name, Length
      - name: Checksum
        run: |
          $sums = Get-Content assets/SHA256SUMS
          foreach ($file in Get-ChildItem assets -Exclude SHA256SUMS) {
            $line = $sums | Where-Object { $_.EndsWith(" $($file.Name)") -or $_.EndsWith("*$($file.Name)") }
            if (-not $line) { throw "$($file.Name) is not in SHA256SUMS" }
            $want = $line.Split(' ')[0].ToLower()
            $have = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $have) { throw "checksum mismatch for $($file.Name): $want $have" }
            "checksum ok: $($file.Name)"
          }
      - name: Attestation
        run: |
          foreach ($file in Get-ChildItem assets -Exclude SHA256SUMS) {
            gh attestation verify $file.FullName --repo $env:GITHUB_REPOSITORY
          }
      - name: Smoke run of the published exe
        run: |
          $zip = Get-ChildItem assets -Filter '*.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName extracted
          $exe = (Get-ChildItem extracted -Recurse -Filter peekbuddy.exe | Select-Object -First 1).FullName
          $run = Start-Process $exe -ArgumentList '--diagnostics' -Wait -PassThru -RedirectStandardOutput diagnostics.txt
          if ($run.ExitCode -ne 0) { throw "--diagnostics exited with $($run.ExitCode)" }
          Get-Content diagnostics.txt | Select-Object -First 20
          "exe=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Defender scan of the asset
        run: |
          $zip = Get-ChildItem assets -Filter '*.zip' | Select-Object -First 1
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Warning 'no MpCmdRun on this runner'; return }
          & $mp -Scan -ScanType 3 -File $zip.FullName
          # 0: clean. 2: a threat was found. Anything else: Defender could not
          # scan on this runner (it is switched off on the x64 image).
          if ($LASTEXITCODE -eq 2) { throw 'Defender flagged the release asset; submit it to Microsoft Security Intelligence before announcing' }
          if ($LASTEXITCODE -ne 0) { Write-Warning "Defender could not scan ($LASTEXITCODE)" }
      - name: cargo audit bin
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-audit --version 0.22.2 --locked --features binary-scanning
          cargo audit bin "$env:exe"
