# The required pipeline (#11). `ci-ok` is the only required check.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  PROPTEST_CASES: 256

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          SKIP: no-commit-to-branch,cargo-clippy
        with:
          prek-version: 0.5.7
          extra-args: --all-files
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pip install --quiet --disable-pip-version-check committed==1.1.11
          # The PR's own commits; HEAD is GitHub's synthetic merge commit.
          committed "${BASE_SHA}..${HEAD_SHA}"

  deny:
    name: cargo-deny
    needs: prek
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources

  core-linux:
    name: core (linux)
    if: false
    needs: prek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: core-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p peekbuddy-core -p peekbuddy-alloc -p peekbuddy-churn --target x86_64-unknown-linux-gnu --locked
      - name: Budgets table in sync
        run: cargo xtask budgets --check

  lint:
    name: lint (windows x64)
    needs: prek
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: lint-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-machete@0.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - run: cargo machete
      - run: cargo xtask check-unsafe
      - run: cargo xtask check-deps
      - name: Benches compile (#26)
        run: cargo bench --no-run --workspace --locked

  test-x64:
    name: test (windows x64)
    needs: prek
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight
        shell: pwsh
        run: ./scripts/ci/preflight.ps1
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: test-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked
      - name: Release build without Tracy (#22) and within the size budget (#28)
        run: |
          cargo build --release --package peekbuddy --locked
          cargo xtask check-release --exe target/release/peekbuddy.exe
          cargo xtask size target/release/peekbuddy.exe
      - name: Churn edge-mix exercises every operation class (#25)
        env:
          PEEKBUDDY_RUNNER_LABEL: windows-2025
        run: cargo xtask churn --profile edge-mix --seed 1 --threads 2 --ledger target/churn/edge-mix-seed1.jsonl
      - name: Churn burst throughput (#25, report only)
        env:
          PEEKBUDDY_RUNNER_LABEL: windows-2025
        run: cargo xtask churn --profile burst-100k --threads 4 --burst 50000 --within 1 --ledger target/churn/burst.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: churn-ledger-x64
          path: target/churn/edge-mix-seed1.jsonl
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-x64
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  etw-smoke:
    name: etw smoke (windows x64)
    needs: prek
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: etw-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p peekbuddy-win --example etw_smoke --locked
      - name: Record the smoke example with the PeekBuddy.Light profile
        shell: pwsh
        run: |
          wpr -profiles 'perf\peekbuddy.wprp'
          wpr -start 'perf\peekbuddy.wprp!PeekBuddy.Light' -filemode
          if ($LASTEXITCODE -ne 0) { throw "wpr -start failed: $LASTEXITCODE" }
          ./target/debug/examples/etw_smoke.exe
          wpr -stop "$env:RUNNER_TEMP\etw-smoke.etl"
          if ($LASTEXITCODE -ne 0) { throw "wpr -stop failed: $LASTEXITCODE" }
          tracerpt "$env:RUNNER_TEMP\etw-smoke.etl" -o "$env:RUNNER_TEMP\etw-smoke.xml" -of XML -y | Out-Null
          $xml = Get-Content "$env:RUNNER_TEMP\etw-smoke.xml" -Raw
          $hits = ([regex]::Matches($xml, '69eb5350-8420-5c03-5c05-1a6dafc0df73', 'IgnoreCase')).Count
          "PeekBuddy provider events in the ETL: $hits"
          if ($hits -lt 7) { throw "expected at least 7 PeekBuddy events (6 milestones + counters), found $hits" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: etw-smoke
          path: ${{ runner.temp }}/etw-smoke.etl
          if-no-files-found: warn

  coverage:
    # Not in ci-ok: the Codecov patch status reports separately (#14).
    name: coverage (windows x64)
    needs: prek
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: coverage-x64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149,cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --no-tests=pass --lcov --output-path lcov.info
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: true

  mutants:
    # Advisory for 4 weeks, then gating for core and store (#15).
    name: mutants in diff (advisory)
    if: github.event_name == 'pull_request'
    needs: test-x64
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: mutants-x64
          save-if: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149,cargo-mutants@27.1.0
      - name: Diff against the base
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}..." > git.diff
      - name: Mutants in diff
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\t | Out-Null
          $env:TMP = 'C:\t'
          $env:TEMP = 'C:\t'
          cargo mutants --no-shuffle -vV --in-diff git.diff --test-tool nextest --in-place --timeout-multiplier 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  bench-ab:
    # Same-runner A/B timing gate (#26, F11): warn +15 %, fail +50 % on
    # pr-ab benches. Required since the false-positive check passed 10 of
    # 10 (bench-noop.yml, PERFORMANCE.md). PRs only: on push and merge
    # group there is no base to compare with, and ci-ok accepts the skip.
    # The table is in the job summary; there is no PR comment (it mailed
    # everyone subscribed to the PR).
    name: bench a/b (windows x64)
    if: github.event_name == 'pull_request'
    needs: prek
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: bench-ab-x64
          save-if: false
      - name: Bench A/B against the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask bench-ab --base "$(git merge-base "origin/${BASE_REF}" HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-ab
          path: target/bench-ab/report.md
          if-no-files-found: ignore

  test-arm64:
    # Advisory until promoted (#11): not in ci-ok's needs.
    name: test (windows arm64) (advisory)
    needs: prek
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preflight
        shell: pwsh
        run: ./scripts/ci/preflight.ps1
      - name: Rust toolchain
        run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: test-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest@0.9.149
      - run: cargo nextest run --workspace --profile ci --locked --no-tests=pass
      - run: cargo test --workspace --doc --locked
      - name: Release build within the size budget (#28)
        run: |
          cargo build --release --package peekbuddy --locked
          cargo xtask size target/release/peekbuddy.exe
      - name: Churn edge-mix exercises every operation class (#25)
        env:
          PEEKBUDDY_RUNNER_LABEL: windows-11-vs2026-arm
        run: cargo xtask churn --profile edge-mix --seed 1 --threads 2 --ledger target/churn/edge-mix-seed1.jsonl
      - name: Churn burst throughput (#25, report only)
        env:
          PEEKBUDDY_RUNNER_LABEL: windows-11-vs2026-arm
        run: cargo xtask churn --profile burst-100k --threads 4 --burst 50000 --within 1 --ledger target/churn/burst.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: churn-ledger-arm64
          path: target/churn/edge-mix-seed1.jsonl
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-arm64
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  ci-ok:
    name: ci-ok
    if: always()
    needs: [prek, deny, core-linux, lint, test-x64, etw-smoke, bench-ab]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | {
            failed=0
            while read -r job result; do
              echo "${job}: ${result}"
              # The bench A/B job only runs on PRs; elsewhere it is skipped.
              if [ "${job}" = "bench-ab" ] && [ "${EVENT}" != "pull_request" ] && [ "${result}" = "skipped" ]; then
                continue
              fi
              if [ "${result}" != "success" ]; then
                echo "::error title=ci-ok::${job} ended with '${result}'"
                failed=1
              fi
            done
            exit "${failed}"
          }
