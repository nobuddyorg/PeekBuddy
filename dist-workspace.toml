[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist 0.33.1), see docs/how-to/release.md (#73).
[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = []
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
hosting = "github"
checksum = "sha256"
github-attestations = true
cargo-auditable = true
cargo-cyclonedx = true
pr-run-mode = "upload"
install-updater = false
# release.yml gets one trigger dist does not know, workflow_dispatch: the tag
# that release-plz creates with the built-in token starts no workflow, so
# release-plz starts this one itself. scripts/ci/release-workflow.ps1 applies
# and checks that one line.
allow-dirty = ["ci"]
include = ["THIRD_PARTY_LICENSES.html"]
github-build-setup = "../build-setup.yml"
post-announce-jobs = ["./release-verify"]

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-vs2026-arm"

# Every action by commit (zizmor, #73); the comment is the tag it was cut from.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"
