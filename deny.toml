# cargo-deny 0.20.2 (#12). Advisories run daily in audit.yml, not in the
# PR gate, so a new advisory never blocks an unrelated PR.

[graph]
# Only what is compiled for the shipped targets.
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# MPL-2.0 only through a per-crate exception with a reason, for example:
# exceptions = [{ crate = "some-crate", allow = ["MPL-2.0"] }] # why
exceptions = []

[bans]
# windows-sys / windows duplicates are tolerated until windows-rs settles (F20).
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Not in the capture path (F2, ADR 0010).
  { crate = "notify", reason = "the core uses ReadDirectoryChangesExW directly (ADR 0010)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
