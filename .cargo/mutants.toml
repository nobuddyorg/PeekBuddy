# cargo-mutants 27.1.0 (#15). Shape the run with examine/exclude, never
# with a score threshold: any missed mutant in examined code fails.
test_tool = "nextest"
additional_cargo_args = ["--all-features"]
profile = "mutants"
# Product logic: event model, parsers, watchers, store, filters, export.
examine_re = [
  "crates/peekbuddy-alloc/",
  "crates/peekbuddy-churn/",
  "crates/peekbuddy-core/",
  "crates/peekbuddy-win/",
  "crates/peekbuddy-store/",
  "crates/peekbuddy-engine/",
]
# UI glue, the tray message pump and logging are tested by e2e and UI
# tests (#71), not by unit tests that can catch mutants.
exclude_re = [
  "tray",
  "message_loop",
  "logging",
  "crates/peekbuddy-viewer/",
  # Equivalent mutants: Win32 access masks are disjoint bit flags, so `^`
  # and `|` give the same value.
  "crates/peekbuddy-win/src/process.rs:.*replace \\| with \\^",
  # Only nextest's listing call passes `--list`; returning false there makes
  # nextest list no test for the binary, which no test can observe.
  # `list_reply` holds the logic and is tested.
  "crates/peekbuddy-alloc/src/lib.rs:.*replace answer_nextest_list -> bool with false",
  # Fixed per runner: Defender real-time is off on windows-2025 and on on
  # windows-11-vs2026-arm, so one constant always matches the machine the
  # mutants run on. The parser is tested; the full query is compared with
  # an independent one (`machine_facts_match_independent_queries`).
  "crates/peekbuddy-churn/src/exec/windows.rs:.*replace defender_realtime -> Option<bool> with Some",
  # Equivalent mutant: `IoSlot::new` rejects empty buffers, so `is_empty`
  # (kept for `len`'s clippy pairing) is always false.
  "crates/peekbuddy-win/src/io/slot.rs:.*replace IoSlot::is_empty -> bool with false",
  # A pending slot leaks its memory on drop so the kernel cannot write into
  # freed pages; no test can observe a leak.
  "crates/peekbuddy-win/src/io/slot.rs:.*replace <impl Drop for IoSlot>::drop with",
  # Equivalent mutant: high and low FILETIME halves do not overlap.
  "crates/peekbuddy-win/src/perf/clock.rs:.*replace \\| with \\^ in ticks",
  # The pool of spare batches is capped at the ring size so its memory stays
  # bounded; going over the cap changes memory, not behaviour. The same
  # comparison is the retry pacing in `commit_group`: three quick tries or
  # four only change how long a failing disk is retried before the writer
  # reports itself failing.
  "crates/peekbuddy-store/src/pipeline.rs:.*replace < with .* in spill_loop",
  "crates/peekbuddy-store/src/pipeline.rs:.*replace < with .* in commit_group",
  # Defence in depth: a record that announces more than fits is rejected
  # twice (against the payload limit and against the end of the file); either
  # check alone gives the same replay, and a record of exactly 64 MiB cannot
  # be tested.
  "crates/peekbuddy-store/src/spill.rs:.*replace (\\|\\| with &&|\\+ with -|> with (==|>=)) in Spill::next",
  # After a close during a failing commit the group goes to the spill file and
  # is counted done; only the panic of `-=` (underflow) can be seen, and is
  # (`closing_while_the_disk_is_full_keeps_the_data_for_the_next_start`).
  # `*=` multiplies a counter nothing reads again.
  "crates/peekbuddy-store/src/pipeline.rs:.*replace \\+= with \\*= in give_to_spill",
  # `length < HEADER_LEN || read_exact(header).is_err()`: a file shorter than
  # the header fails the read as well, so `<` and `==` act the same.
  "crates/peekbuddy-store/src/spill.rs:.*replace < with == in Spill::open",
  # The page cache and journal size limits are tuning constants; other
  # values change speed and disk use, not what is stored.
  "crates/peekbuddy-store/src/writer.rs:(30|32|34):.*replace \\* with",
  # Debug-only invariant: `check_cursors` feeds a `debug_assert_eq!`, which
  # cannot fail while the code is correct.
  "crates/peekbuddy-store/src/writer.rs:.*Writer::check_cursors",
  # `commit.rows > 0`: a commit without rows leaves both commit timestamps
  # at 0, so `>=` writes the same ones.
  "crates/peekbuddy-store/src/writer.rs:.*replace > with >= in Writer::write_with_spill",
  # A segment row without rows has first_id == next_id, so `>= 0` picks the
  # same first id.
  "crates/peekbuddy-store/src/writer.rs:.*replace > with >= in Writer::open_segments",
  # `MemorySnapshot::paths` stops at a missing parent row (the `let ... else
  # break`) and the hop count only guards a parent cycle, which the API
  # cannot build: `&&` with `||`, `<` with `<=` and `+=` with `-=` or `*=`
  # change nothing a test can reach.
  "crates/peekbuddy-core/src/reconcile/memory.rs:.*MemorySnapshot::paths",
  # `by_id` only holds non-zero file ids, so a created entry with file id 0
  # never finds a partner and the match guard is always true when it matters.
  "crates/peekbuddy-core/src/reconcile/walk.rs:.*replace match guard entry.meta.file_id != 0 with true in settle",
  # Equivalent mutants: the bits of `DATA_ACCESS` are disjoint, so `|` and
  # `^` build the same mask.
  "crates/peekbuddy-win/src/io/open.rs:.*replace \\| with \\^",
  # Equivalent mutant: the guard `path.exists()` follows a successful
  # read-only open of the same path, so it only differs when the file vanishes
  # between the two calls, which no test can arrange.
  "crates/peekbuddy-store/src/segment.rs:.*replace match guard path.exists\\(\\) with true in NewestFirst::next_segment",
  # Equivalent mutants: the reason bits of `NEVER` and `STATE_ONLY` are
  # disjoint constants, so `|` and `^` build the same masks.
  "crates/peekbuddy-core/src/reparse/mod.rs:.*replace \\| with \\^",
  # `unwrap_or(i64::MAX / 2)` only runs for a time that does not fit an i64,
  # and `ts` is clamped to MAX_TS first.
  "crates/peekbuddy-core/src/export/mod.rs:.*replace / with % in civil",
  # Equivalent mutant: the root is a member of every scope, so the set is
  # never empty and `is_empty` is always false.
  "crates/peekbuddy-core/src/usn/scope/mod.rs:.*replace Scope::is_empty -> bool with false",
  # `RtlSetProcessPlaceholderCompatibilityMode` fails only for a mode the
  # call does not know, and the mode is a constant: `true` is what the call
  # returns on every machine a test can run on.
  "crates/peekbuddy-win/src/osinfo.rs:.*replace expose_placeholders -> bool with true",
  # `RtlGetVersion` does not fail for a valid structure (its status is never
  # negative here).
  "crates/peekbuddy-win/src/osinfo.rs:.*replace < with > in os_build",
  # Defender real-time is off on windows-2025, where the mutants run, so a
  # constant `Some(false)` is the right answer on that runner; the parser and
  # the full query are compared with `reg.exe` by `os_facts.rs`.
  "crates/peekbuddy-win/src/osinfo.rs:.*replace defender_realtime_enabled -> Option<bool> with Some.false.",
  # `ERROR_NOT_READY` is what a drive without a medium (an empty card reader
  # or optical drive) answers; neither runner has one and a test cannot make
  # one. The branches only pick the `NotReady` verdict over `VolumeGone`.
  "crates/peekbuddy-win/src/probe.rs:.*(delete match arm ERROR_NOT_READY in probe_root|replace match guard code\\(&inner\\) == ERROR_NOT_READY with (true|false) in probe_root|replace == with != in probe_root)",
  # `FSCTL_IS_VOLUME_MOUNTED` fails on a handle that is open only when the
  # volume goes away under it; the vdisk detach test of the nightly (#48)
  # drives that path through the lifecycle states, not through this function.
  "crates/peekbuddy-win/src/probe.rs:.*(replace is_mounted -> .* with Ok|replace == with != in is_mounted)",
  # The mode flags of the pipe are zero (`PIPE_TYPE_BYTE`, `PIPE_READMODE_BYTE`,
  # `PIPE_WAIT`) or disjoint bits, so `^` builds the same value as `|`; `&` drops
  # `PIPE_REJECT_REMOTE_CLIENTS`, which only a client on another machine can
  # tell, and `INSTANCES + 2` is `INSTANCES * 2` for INSTANCES == 2. The same
  # holds for the impersonation flags of `PipeClient::connect`.
  "crates/peekbuddy-win/src/pipe.rs:.*replace . with . in (create_instance|PipeClient::connect)",
  # The pipe buffers are advisory sizes: a pipe with another size carries the
  # same bytes (the 20 kB payload of the echo test goes through either way).
  "crates/peekbuddy-win/src/pipe.rs:49:",
  # The security descriptor is freed after the pipe was created; a leak cannot
  # be observed by a test.
  "crates/peekbuddy-win/src/pipe.rs:.*<impl Drop for Dacl>::drop",
  # `Debug` output is not behaviour: nothing but a log line reads it.
  "replace <impl .*Debug.*>::fmt -> .* with Ok.Default::default..",
  # A mutant that makes an I/O loop, the completion port, the window procedure
  # or the lifecycle worker wait forever fails the suite by hanging; cargo-mutants
  # reports a hang as a timeout, not as caught, and exits non-zero for it.
  "crates/peekbuddy-win/src/io/iocp.rs:.*(Iocp::(associate|post|dequeue)|Completion::is_success|Batch::iter)",
  "crates/peekbuddy-win/src/io/slot.rs:.*IoSlot::(overlapped_addr|finish|data|len)",
  "crates/peekbuddy-win/src/io/volume.rs:.*final_path",
  "crates/peekbuddy-win/src/io/error.rs:.*WinError::code",
  "crates/peekbuddy-win/src/window.rs:.*(WindowHandle::(hwnd|post_close|send_timeout)|HiddenWindow::set_one_shot_timer)",
  # The console glue changes where output goes in a process that was started
  # from a terminal; a test binary has no parent console to attach to.
  "crates/peekbuddy-win/src/console.rs:",
  # Only an ETW session reads the events; the etw smoke job (#22) listens.
  "crates/peekbuddy-win/src/perf/etw.rs:.*replace (milestone|counters) with",
  # Both answers are valid on some machine: `short_names_generated` is the
  # volume setting of the runner (a constant equals it), and the case-mode
  # error is only reported by a volume without case-sensitivity support (FAT).
  "crates/peekbuddy-win/src/fs/win.rs:.*(replace short_names_generated -> .* with Ok|replace match guard means_no_case_sensitivity)",
  # `KEY_READ` and `KEY_WRITE` share `READ_CONTROL`, which an open does not
  # need; a key handle that is not closed is not observable.
  "crates/peekbuddy-win/src/autostart.rs:.*(replace . with . in Key::create|<impl Drop for Key>::drop)",
  # The journal control call completes at once on these handles, so the
  # pending branch (`GetOverlappedResult`) cannot be reached by a test; and
  # the read thread of a journal stops through a flag and a cancelled call:
  # the mutants only change how soon it notices, or hang.
  "crates/peekbuddy-win/src/usn.rs:.*replace (==|!=) with (!=|==) in Journal::control",
  "crates/peekbuddy-win/src/usn/sync.rs:.*(delete ! in (SyncReader::stop|Worker::run)|replace && with .. in Worker::run|replace Worker::stopping -> bool with false)",
]
