[package]
name = "peekbuddy"
description = "PeekBuddy: silently watches your folders and logs every change."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# tracy-client-sys is a direct dependency only to pin its exact version
# (the Tracy protocol, #22); no code names it.
[package.metadata.cargo-machete]
ignored = ["tracy-client-sys"]

[features]
# Forwards the engine's crash trigger for the integration tests (#59).
test-panic = ["peekbuddy-engine/test-panic"]
# Tracy profiling (#22). Never enabled in release builds; CI checks that
# the release feature set has no Tracy code.
profile-tracy = [
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tracing-tracy",
  "dep:tracy-client",
  "dep:tracy-client-sys",
  "tracing-tracy/enable",
  "tracing-tracy/ondemand",
  "tracing-tracy/only-localhost",
  "tracing-tracy/sampling",
  "tracing-tracy/context-switch-tracing",
]
# Tracy allocation call stacks around the counting allocator (#23).
profile-tracy-alloc = ["profile-tracy", "dep:peekbuddy-alloc"]

[dependencies]
peekbuddy-alloc = { workspace = true, optional = true }
peekbuddy-core = { workspace = true }
peekbuddy-engine = { workspace = true }
peekbuddy-viewer = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }
tracy-client-sys = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
peekbuddy-win = { workspace = true }

[build-dependencies]
embed-manifest = { workspace = true }
winresource = { workspace = true }

[dev-dependencies]
peekbuddy-testkit = { workspace = true }

[lints]
workspace = true
