[package]
name = "peekbuddy-viewer"
description = "On-demand egui viewer window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Makes the in-memory log of the tests public, for `tests/alloc_viewer.rs`.
# The crate enables it for its own tests through the dev-dependency below.
test-support = []
# A Tracy frame mark per egui frame and the page fetch time as a plot (#163).
# Only the profiling build turns it on.
tracy = ["dep:tracy-client"]
# Uses wgpu with DX12 on x64 too and never tries glow, for A/B runs (ADR
# 0005). arm64 is on wgpu either way.
wgpu = []

[dependencies]
egui = { workspace = true }
egui_table = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }
tracy-client = { workspace = true, optional = true }

# arm64 has no OpenGL driver, so it always renders through wgpu with DX12
# only. eframe's `wgpu` feature would switch on every backend, so the crate is
# asked for `wgpu_no_default_features` and the DX12 backend comes from the
# `wgpu` line below.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu_no_default_features",
] }
wgpu = { workspace = true }

# The window and the renderers (ADR 0005, #252). x64 tries glow (OpenGL)
# first, about 255 MB less private bytes than wgpu, and falls back to wgpu
# when the machine has no OpenGL 2.0 driver, so both are built in.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "wgpu_no_default_features",
] }
peekbuddy-win = { workspace = true, features = ["glow"] }
wgpu = { workspace = true }

[target.'cfg(windows)'.dependencies]
peekbuddy-win = { workspace = true, features = ["picker"] }
raw-window-handle = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
insta = { workspace = true }
peekbuddy-alloc = { workspace = true }
# Itself, to switch on `test-support` for the integration tests.
peekbuddy-viewer = { path = ".", features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true

[[test]]
name = "alloc_viewer"
harness = false
