[package]
name = "peekbuddy-viewer"
description = "On-demand egui viewer window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# Named only to choose the backends of the wgpu that eframe uses.
ignored = ["wgpu"]

[dependencies]
egui = { workspace = true }
egui_table = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The window and the renderer. wgpu with DX12 only (ADR 0005): eframe's
# `wgpu` feature would switch on every backend, so the crate is asked for
# `wgpu_no_default_features` and the DX12 backend comes from the `wgpu` line
# below. The glow build on x64 follows in #252.
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu_no_default_features",
] }
peekbuddy-win = { workspace = true }
raw-window-handle = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
