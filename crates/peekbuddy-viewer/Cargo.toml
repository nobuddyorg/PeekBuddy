[package]
name = "peekbuddy-viewer"
description = "On-demand egui viewer window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# Named only to choose the backends of the wgpu that eframe uses.
ignored = ["wgpu"]

[features]
# Makes the in-memory log of the tests public, for `tests/alloc_viewer.rs`.
# The crate enables it for its own tests through the dev-dependency below.
test-support = []
# Renders through wgpu with DX12 on x64 too, for A/B runs against glow (ADR
# 0005). Cargo features only add, so this is the opt-in; arm64 is on wgpu
# either way.
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]

[dependencies]
egui = { workspace = true }
egui_table = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }

[target.'cfg(windows)'.dependencies]
peekbuddy-win = { workspace = true, features = ["picker"] }
raw-window-handle = { workspace = true }

# The window and the renderer (ADR 0005, #252). x64 renders through glow
# (OpenGL): about 260 MB less private bytes and a 7 MB smaller exe than wgpu.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
peekbuddy-win = { workspace = true, features = ["glow"] }
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
] }
wgpu = { workspace = true, optional = true }

# arm64 has no OpenGL driver, so it always renders through wgpu with DX12
# only. eframe's `wgpu` feature would switch on every backend, so the crate is
# asked for `wgpu_no_default_features` and the DX12 backend comes from the
# `wgpu` line below.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu_no_default_features",
] }
wgpu = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
insta = { workspace = true }
peekbuddy-alloc = { workspace = true }
# Itself, to switch on `test-support` for the integration tests.
peekbuddy-viewer = { path = ".", features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true

[[test]]
name = "alloc_viewer"
harness = false
