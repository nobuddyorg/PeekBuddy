[package]
name = "peekbuddy-viewer"
description = "On-demand egui viewer window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
# Named only to choose the backends of the wgpu that eframe uses.
ignored = ["wgpu"]

[features]
# Makes the in-memory log of the tests public, for `tests/alloc_viewer.rs`.
# The crate enables it for its own tests through the dev-dependency below.
test-support = []

[dependencies]
egui = { workspace = true }
egui_table = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The window and the renderer. wgpu with DX12 only (ADR 0005): eframe's
# `wgpu` feature would switch on every backend, so the crate is asked for
# `wgpu_no_default_features` and the DX12 backend comes from the `wgpu` line
# below. The glow build on x64 follows in #252.
eframe = { version = "=0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu_no_default_features",
] }
peekbuddy-win = { workspace = true, features = ["picker"] }
raw-window-handle = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
insta = { workspace = true }
peekbuddy-alloc = { workspace = true }
# Itself, to switch on `test-support` for the integration tests.
peekbuddy-viewer = { path = ".", features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true

[[test]]
name = "alloc_viewer"
harness = false
