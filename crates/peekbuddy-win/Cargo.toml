[package]
name = "peekbuddy-win"
description = "Thin safe wrappers over windows-sys and OS-independent record parsers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The native folder picker (#68): `IFileOpenDialog` through the `windows`
# crate, because windows-sys has no COM vtables. Only the viewer asks for it.
picker = ["dep:windows"]
# The Start-menu shortcut with an AppUserModelID that toasts need (#81).
aumid = ["dep:windows"]
# A UI Automation client for the end-to-end smoke test of the viewer (#71).
uia = ["dep:windows"]
# The OpenGL renderer string for the viewer's startup log (#252).
glow = ["dep:glow"]
# The USN journal reader (#47, ADR 0018). Off in v1: the unprivileged read
# returns no names, so the shipped capture path is RDCW with reconciliation.
usn = []

[dependencies]
glow = { workspace = true, optional = true }
peekbuddy-core = { workspace = true }
tracelogging = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { workspace = true, features = [
  "Wdk_Storage_FileSystem",
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_System_Diagnostics_ToolHelp",
  "Wdk_System_SystemServices",
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
peekbuddy-alloc = { workspace = true }
proptest = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Globalization",
  "Win32_System_SystemServices",
] }

[[test]]
name = "alloc_perf"
harness = false

[lints]
workspace = true
