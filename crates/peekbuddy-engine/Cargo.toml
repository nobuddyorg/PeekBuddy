[package]
name = "peekbuddy-engine"
description = "Tray-resident capture engine: watches, writer and reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Tracy plots and a frame mark per committed batch (#163). Only the profiling
# build turns it on.
tracy = ["dep:tracy-client"]
# The USN journal capture source (#212, ADR 0018). Off in v1.
usn = ["peekbuddy-win/usn"]
# Compiles the --test-panic crash trigger (#59). Never enabled in releases.
test-panic = []
# Compiles the deliberate regressions of the perf harness self-check (#269).
# Never enabled in releases.
inject = []

[dependencies]
peekbuddy-core = { workspace = true }
tracy-client = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
known-folders = { workspace = true }
peekbuddy-store = { workspace = true }
peekbuddy-win = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
jsonschema = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
