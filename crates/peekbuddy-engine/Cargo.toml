[package]
name = "peekbuddy-engine"
description = "Tray-resident capture engine: watches, writer and reconciliation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Compiles the --test-panic crash trigger (#59). Never enabled in releases.
test-panic = []

[dependencies]
peekbuddy-core = { workspace = true }

[target.'cfg(windows)'.dependencies]
known-folders = { workspace = true }
peekbuddy-store = { workspace = true }
peekbuddy-win = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
jsonschema = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
