[workspace]
resolver = "3"
members = [
  "benches",
  "crates/peekbuddy",
  "crates/peekbuddy-alloc",
  "crates/peekbuddy-churn",
  "crates/peekbuddy-core",
  "crates/peekbuddy-engine",
  "crates/peekbuddy-store",
  "crates/peekbuddy-testkit",
  "crates/peekbuddy-viewer",
  "crates/peekbuddy-win",
  "xtask",
]
# Spikes are throwaway measurement code with their own workspaces.
exclude = ["fuzz", "spikes"]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.100.0"
license = "MIT"
repository = "https://github.com/nobuddyorg/PeekBuddy"
publish = false

[workspace.dependencies]
# Test-only (#13). Cargo 1.100 warns on unused workspace dependencies, so
# proptest 1.12.0, proptest-state-machine 0.9.0, rstest 0.28.0 and the
# internal crates join here with their first user (versions in TEST_STRATEGY.md).
# criterion without plotters and rayon: the A/B gate (#26) runs --noplot.
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }
# Viewer (#65): egui, eframe and egui_table are exact pins; they break
# every ~6 weeks, so a bump is a reviewed PR (F20, ADR 0010).
# `egui` itself is toolkit-only and builds on Linux, so the view code is
# tested there; `eframe` (window and renderer) is a Windows-only dependency
# of the viewer crate.
egui = { version = "=0.37.0", default-features = false, features = [
  "default_fonts",
] }
egui_kittest = { version = "=0.37.0", default-features = false }
egui_table = "=0.11.0"
# Engine process skeleton (#59): manifest and resources at build time, known
# folders for the data dir (ADR 0010).
embed-manifest = "1.5.1"
# OpenGL bindings of eframe's glow renderer (#252), for the one `unsafe` query
# in `peekbuddy-win`. The version is the one eframe 0.37.0 builds.
glow = { version = "=0.17.0", default-features = false }
insta = "1.49.0"
# Validates --perf-probe output against perf/probe.schema.json (#161); test-only.
jsonschema = { version = "0.60.1", default-features = false }
known-folders = "1.4.2"
# The optional allocator of the exe (#268); the default stays the system one.
mimalloc = { version = "=0.1.52", default-features = false }
peekbuddy-alloc = { path = "crates/peekbuddy-alloc" }
peekbuddy-churn = { path = "crates/peekbuddy-churn" }
peekbuddy-core = { path = "crates/peekbuddy-core" }
peekbuddy-engine = { path = "crates/peekbuddy-engine" }
peekbuddy-store = { path = "crates/peekbuddy-store" }
peekbuddy-testkit = { path = "crates/peekbuddy-testkit" }
peekbuddy-viewer = { path = "crates/peekbuddy-viewer" }
peekbuddy-win = { path = "crates/peekbuddy-win" }
proptest = "1.12.0"
proptest-state-machine = "0.9.0"
# Hands the viewer's HWND to the Win32 wrappers (eframe re-uses this crate).
raw-window-handle = "0.6.2"
# Filter engine (#40): fully built DFAs (no lazy cache, so matching never
# allocates). Versions are recorded in ADR 0010.
regex-automata = { version = "0.4.18", default-features = false, features = [
  "dfa-build",
  "dfa-search",
  "std",
  "syntax",
  "unicode",
] }
rstest = { version = "0.28.0", default-features = false }
# SQLite store (#53): bundled SQLite, versions recorded in ADR 0004.
rusqlite = { version = "=0.41.1", features = ["bundled", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Toasts of the rules (#81). It brings `windows-version` and `thiserror` and
# builds on the same `windows` as the picker, so there is no second copy.
tauri-winrt-notification = "=0.8.1"
# Filter presets (#40) parse; settings (#62) also write (`display`).
toml = { version = "1.1.8", default-features = false, features = [
  "display",
  "parse",
  "serde",
] }
tracelogging = "1.2.4"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "registry",
  "std",
] }
# Tracy (#22): the three crates move together with the Tracy GUI version
# (0.14.1); bumps are manual and Dependabot ignores them.
tracing-tracy = { version = "=0.12.0", default-features = false }
tracy-client = { version = "=0.19.0", default-features = false }
tracy-client-sys = { version = "=0.30.1", default-features = false }
# The viewer renders through DX12 only (ADR 0005). eframe's `wgpu` feature
# switches on every backend of wgpu, including Vulkan (`ash`) and GLES (which
# pulls in opengl32.dll and glu32.dll); this direct dependency picks the one
# that is used. The version follows eframe 0.37.0.
wgpu = { version = "=30.0.1", default-features = false, features = [
  "dx12",
  "parking_lot",
  "std",
  "wgsl",
] }
# COM for the native folder picker (#68) only, in `peekbuddy-win`'s optional
# `picker` feature. The version is the one wgpu-hal and AccessKit already
# build, so the tree gets no second copy. windows-sys has no COM vtables.
windows = { version = "=0.62.2", default-features = false }
# Exact pin: every bump is a reviewed PR (ADR 0010, F20).
windows-sys = "=0.61.2"
winresource = "0.1.34"

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# The shipped exe (#28). Every setting is explicit: since Rust 1.77.1 the
# MSVC targets no longer strip debuginfo by default. panic = "abort" rules
# out catch_unwind in release paths. Test and bench targets keep unwinding
# (Cargo ignores `panic` for them).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
incremental = false

# The shipped build with symbols (#28): release code, line tables, a separate
# PDB that release jobs publish (built with /PDBALTPATH so the exe does not
# carry the build machine's path). Adopted only if the exe grows by a few
# bytes: see PERFORMANCE.md.
[profile.dist]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Profiling builds (#22): release code with line tables and symbols, PDB
# next to the exe. Switch `debug` to "full" for variable-level debugging.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
split-debuginfo = "packed"

# cargo-mutants builds (#15): no debug info to cut build time.
[profile.mutants]
inherits = "test"
debug = "none"
