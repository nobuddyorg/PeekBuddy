# Raw captures (file names from the runners, hashes) are not prose.
[files]
extend-exclude = [
  "Cargo.lock",
  "LICENSE",
  "docs/spikes/data/**",
  "crates/peekbuddy-core/tests/fixtures/**",
  "crates/peekbuddy-core/src/settings/load/**",
]

[default.extend-words]
# Windows and file-system terms.
FILETIME = "FILETIME"
FRN = "FRN"
USN = "USN"
