[package]
name = "benches"
description = "Micro-benchmarks for PeekBuddy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Only the criterion targets are benches; libtest rejects criterion flags.
bench = false

[dev-dependencies]
criterion = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }
peekbuddy-win = { workspace = true }
rusqlite = { workspace = true }

[[bench]]
name = "hot_paths"
harness = false

# The query layer at 1M and 10M rows (#267); does nothing unless
# PEEKBUDDY_QUERY_ROWS is set.
[[bench]]
name = "query"
harness = false

[lints]
workspace = true
