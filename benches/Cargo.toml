[package]
name = "benches"
description = "Micro-benchmarks for PeekBuddy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Only the criterion targets are benches; libtest rejects criterion flags.
bench = false

[dev-dependencies]
criterion = { workspace = true }
egui = { workspace = true }
peekbuddy-core = { workspace = true }
peekbuddy-store = { workspace = true }
peekbuddy-viewer = { workspace = true, features = ["test-support"] }
peekbuddy-win = { workspace = true }
rusqlite = { workspace = true }

[[bench]]
name = "hot_paths"
harness = false

# The query layer at 1M and 10M rows (#267); does nothing unless
# PEEKBUDDY_QUERY_ROWS is set.
[[bench]]
name = "query"
harness = false

# Private bytes of the viewer with 1M and with 10M rows (#347); does nothing
# unless PEEKBUDDY_QUERY_ROWS and PEEKBUDDY_PERF_OUT are set.
[[bench]]
name = "viewer_memory"
harness = false

# The scripted scroll of the log grid (#347): frame p95 and p99.
[[bench]]
name = "viewer"
harness = false

[lints]
workspace = true
