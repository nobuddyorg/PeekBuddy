# Performance budgets: the single source of truth (#20).
# PERFORMANCE.md renders this file; `cargo xtask budgets --check` fails CI
# when the two disagree. Field reference is in PERFORMANCE.md.
#
# class:  deterministic | timing | resource
# gate:   pr-strict | pr-ab | nightly-ab | nightly-trend | report-only
# status: provisional | calibrated
# bound:  max (value must stay <= limit) | min (value must stay >= limit)
# limit is omitted while the number is still to be set by the named issue.

[[budget]]
id = "engine.ready.warm"
metric = "engine ready (tray icon added and all watchers armed) since process creation, warm start"
unit = "ms"
bound = "max"
limit = 100
class = "timing"
gate = "pr-ab"
status = "provisional"
source = "F7"
workload = "10 roots, idle"
how = "TraceLogging milestone + --perf-probe JSON (#21, #24)"
arch = ["x86_64", "aarch64"]

[[budget]]
id = "engine.ready.cold"
metric = "engine ready since process creation, cold start (after reboot)"
unit = "ms"
bound = "max"
limit = 300
class = "timing"
gate = "report-only"
status = "provisional"
source = "F7"
workload = "10 roots, idle; owner-PC runs only (#84)"
how = "TraceLogging milestone in a WPR trace"
arch = ["x86_64"]

