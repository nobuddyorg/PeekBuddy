# Micro-benchmarks (#26): one row per criterion id in benches/benches/,
# `bench.` + the id with `/` as `.`. `cargo xtask bench-ab` compares base and
# head on the same runner; there is no absolute limit (F11).

[[budget]]
id = "bench.perf.milestone_record"
metric = "one milestone record plus its ETW event, no trace session listening"
unit = "ns"
bound = "max"
class = "timing"
gate = "pr-ab"
status = "provisional"
source = "#26, #21"
workload = "criterion bench perf/milestone_record"
how = "cargo xtask bench-ab (same-runner A/B, warn +15 %, fail +50 %)"
arch = ["x86_64"]

