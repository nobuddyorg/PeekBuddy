[[budget]]
id = "event.latency.p50"
metric = "change to durable row latency, median"
unit = "ms"
bound = "max"
limit = 100
class = "timing"
gate = "pr-ab"
scenario = "ingest"
status = "calibrated"
source = "R1; #497 (owner PC, Intel N150, Defender on, 2026-11-21, ten latency-10k runs of main at 3.1k-3.3k events/s, the generator's limit): 74.7-91.1 ms, median 83.6 ms. End to end, from the end of an operation to its row in the log; #35 measured the commit path alone (3.2 ms). The hosted runners give 120-170 s because the churn saturates their disk (the generator reaches about 2k of 10k operations/s) and the passive checkpoint waits for it; the row is judged by A/B on one runner (ADR 0007)"
workload = "churn profile latency-10k (#25)"
how = "ledger timestamp vs the first sighting of the row by a 5 ms poller of the log (#27)"
arch = ["x86_64", "aarch64"]
owner_pc = 83.6

