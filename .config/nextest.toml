# cargo-nextest configuration (#13). See TEST_STRATEGY.md.

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = { period = "500ms", result = "fail" }

[test-groups]
# Tests that open a watcher, a VHD or a USN journal, or share a fixed root.
fs-serial = { max-threads = 1 }
# Tests that launch peekbuddy.exe.
e2e = { max-threads = 2 }
# Tests with a visible viewer window: two windows at once take the focus from
# each other, and the idle test counts the focus events (#458).
desktop = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(/^fs_serial/)"
test-group = "fs-serial"

# The nightly zero-loss tier (#277) runs a million events, five forced
# overflows and a kill in a burst; each is one test, up to 75 minutes (the million takes about 30 on a hosted runner).
# nextest applies the first matching override per setting, so this one
# stands before the whole-binary one.
[[profile.default.overrides]]
filter = "binary(fs_serial_zero_loss) & (test(a_million_events) | test(a_forced_overflow_burst) | test(a_kill_in_the_middle_of_a_burst) | test(a_watched_root_deleted))"
slow-timeout = { period = "300s", terminate-after = 15 }

# The zero-loss and kill suites run the whole engine under churn.
[[profile.default.overrides]]
filter = "binary(fs_serial_zero_loss) | binary(fs_serial_kill)"
slow-timeout = { period = "60s", terminate-after = 5 }

# The 10-million-event deriver test (nightly only, #41) needs about three
# minutes in a debug build.
[[profile.default.overrides]]
filter = "test(ten_million_distinct_paths)"
slow-timeout = { period = "300s", terminate-after = 4 }

# The segment rotation property test runs 200 cases in the nightly.
[[profile.default.overrides]]
filter = "test(rotation_keeps_the_invariants_with_dst_days_and_a_wandering_clock)"
slow-timeout = { period = "120s", terminate-after = 5 }

# The UI Automation smoke of the viewer (#71): a real window, one visible
# viewer at a time with the viewer tests, retried twice because a desktop
# can be busy.
[[profile.default.overrides]]
filter = "binary(/^e2e/)"
test-group = "desktop"
retries = { backoff = "exponential", count = 2, delay = "5s" }
slow-timeout = { period = "60s", terminate-after = 3 }

# The viewer tests open windows too (the idle one counts focus events).
[[profile.default.overrides]]
filter = "binary(=viewer)"
test-group = "desktop"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# Flakes are bugs: no retries outside the e2e group.
retries = 0

[profile.ci.junit]
path = "junit.xml"

# The paging property test builds a store per case; the nightly runs 40 cases
# (PEEKBUDDY_HEAVY_CASES) and took longer than 120 s on a hosted runner (#423).
[[profile.default.overrides]]
filter = "test(paging_from_any_cursor_equals_a_naive_model)"
slow-timeout = { period = "120s", terminate-after = 5 }
